name: Feature Request
description: Propose an architectural or documentation improvement to Skill Santuy.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation are you experiencing?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed change or addition.
    validations:
      required: true
