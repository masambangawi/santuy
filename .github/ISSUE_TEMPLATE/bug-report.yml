name: Bug Report
description: Report unexpected behavior, prompt leaks, or safety breaches in Skill Santuy.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you do not include private credentials, API keys, or sensitive personal data in this issue.
  - type: input
    id: harness
    attributes:
      label: Harness / Environment
      description: What AI coding harness are you using? (e.g., OpenCode, Claude Code, Cursor, Windsurf)
      placeholder: e.g., OpenCode v0.1.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred? (e.g., did slang leak into generated code files?)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Provide prompts and steps to reproduce the issue.
